<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vagas em Mineiros-GO</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mut:#667085;--bd:#e4e7ec;--ac:#0b6e4f;--ac2:#e7f5ef;--warn:#b54708;--err:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--tx:#e8eaed;--mut:#98a2b3;--bd:#2a2f3a;--ac:#3ecf8e;--ac2:#12301f;--warn:#f79009;--err:#f97066}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
h1{margin:0;font-size:22px}.sub{color:var(--mut);font-size:13px;margin:2px 0 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:26px}.kpi span{color:var(--mut);font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
input{flex:1;min-width:180px}
.job{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.job a.t{color:var(--tx);font-weight:600;text-decoration:none}.job a.t:hover{color:var(--ac)}
.meta{color:var(--mut);font-size:13px;margin-top:2px}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--ac2);color:var(--ac);white-space:nowrap;font-weight:600}
.tag.src{background:var(--bd);color:var(--mut);font-weight:500}
h2{font-size:15px;margin:26px 0 8px}
.src-row{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.src-row a{color:var(--ac)}.ok{color:var(--ac)}.vazio,.desativada{color:var(--warn)}.erro{color:var(--err)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
</style>
</head>
<body>
<main>
<h1>Vagas em Mineiros – GO</h1>
<div class="sub" id="upd">Carregando…</div>
<div class="kpis">
  <div class="kpi"><b id="k-total">–</b><span>vagas abertas</span></div>
  <div class="kpi"><b id="k-new">–</b><span>novas hoje</span></div>
  <div class="kpi"><b id="k-week">–</b><span>novas nos últimos 7 dias</span></div>
  <div class="kpi"><b id="k-src">–</b><span>fontes com vagas</span></div>
</div>
<div class="bar">
  <input id="q" placeholder="Buscar cargo ou empresa…" type="search">
  <select id="fs"><option value="">Todas as fontes</option></select>
  <select id="fd"><option value="">Qualquer data</option><option value="0">Novas hoje</option><option value="7">Últimos 7 dias</option></select>
</div>
<div id="list"></div>
<h2>Fontes</h2>
<div id="sources"></div>
<div class="sub" style="margin-top:10px">Algumas fontes bloqueiam coleta automática. Os links abaixo abrem a busca direto em Mineiros.</div>
<div id="manual"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u)?u:"#";
let D={jobs:[],sources:[],manual_links:[]};
const today=new Date().toLocaleDateString("sv",{timeZone:"America/Sao_Paulo"});
const age=d=>Math.round((new Date(today)-new Date(d))/864e5);
function render(){
  const q=$("q").value.toLowerCase(),fs=$("fs").value,fd=$("fd").value;
  const L=D.jobs.filter(j=>(!fs||j.source===fs)&&(!q||(j.title+" "+j.company).toLowerCase().includes(q))
    &&(fd===""||age(j.first_seen)<=+fd));
  $("list").innerHTML=L.length?L.map(j=>`<div class="job"><div>
    <a class="t" href="${safeUrl(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
    <div class="meta">${esc(j.company||"Empresa não informada")} · ${esc(j.location)} · visto pela 1ª vez em ${esc(j.first_seen.split("-").reverse().join("/"))}</div></div>
    <div style="display:flex;gap:6px;flex-direction:column;align-items:flex-end">
    ${age(j.first_seen)===0?'<span class="tag">NOVA</span>':""}<span class="tag src">${esc(j.source)}</span></div></div>`).join("")
    :'<div class="empty">Nenhuma vaga encontrada com esses filtros.</div>';
}
fetch("data/jobs.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  D=d;const J=d.jobs;
  $("upd").textContent=d.updated_at?"Atualizado em "+new Date(d.updated_at).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})+" · atualização automática diária":"Ainda sem coleta. Rode o workflow no GitHub Actions.";
  $("k-total").textContent=J.length;
  $("k-new").textContent=J.filter(j=>age(j.first_seen)===0).length;
  $("k-week").textContent=J.filter(j=>age(j.first_seen)<=7).length;
  $("k-src").textContent=new Set(J.map(j=>j.source)).size;
  [...new Set(J.map(j=>j.source))].sort().forEach(s=>$("fs").insertAdjacentHTML("beforeend",`<option>${esc(s)}</option>`));
  $("sources").innerHTML=d.sources.map(s=>`<div class="src-row"><b>${esc(s.name)}</b>
    <span class="${esc(s.status)}">${esc(s.status)}${s.status==="ok"?" ("+s.count+")":""}</span>
    <a href="${safeUrl(s.url)}" target="_blank" rel="noopener">abrir busca</a>
    ${s.error?`<span style="color:var(--mut)">${esc(s.error)}</span>`:""}</div>`).join("");
  $("manual").innerHTML=(d.manual_links||[]).map(s=>`<div class="src-row"><b>${esc(s.name)}</b><a href="${safeUrl(s.url)}" target="_blank" rel="noopener">abrir busca</a></div>`).join("");
  render();
}).catch(()=>{$("upd").textContent="Não foi possível carregar data/jobs.json";});
["q","fs","fd"].forEach(i=>$(i).addEventListener("input",render));
</script>
</body>
</html>
